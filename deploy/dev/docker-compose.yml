services:
  app:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: file:/data/local.db
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-development-only-secret-change-me-now}
      CLIENT_URL: http://localhost:3000
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data: